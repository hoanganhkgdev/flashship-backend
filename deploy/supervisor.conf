; ============================================================
; FlashShip – Supervisor config
; Copy file này vào: /etc/supervisor/conf.d/flashship.conf
; Sau đó chạy: sudo supervisorctl reread && sudo supervisorctl update
; ============================================================
;
; Thay /var/www/flashship-app/backend bằng đường dẫn thực tế trên server
; Thay www-data bằng user chạy web server (www-data / nginx / ubuntu / ...)

; ----------------------------------------------------------
; Laravel Scheduler — thay thế cron, chạy schedule:work
; ----------------------------------------------------------
[program:flashship-scheduler]
command=php /var/www/flashship-app/backend/artisan schedule:work
directory=/var/www/flashship-app/backend
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/flashship-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; ----------------------------------------------------------
; Laravel Queue Worker — xử lý job (FCM, dispatch, ...)
; ----------------------------------------------------------
[program:flashship-queue]
command=php /var/www/flashship-app/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/flashship-app/backend
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/flashship-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
