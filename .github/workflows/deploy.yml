name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to app.flashship.vn
        uses: appleboy/ssh-action@v1.0.3
        env:
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
        with:
          host: 103.200.20.95
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: APNS_PRIVATE_KEY,PAYOS_CLIENT_ID,PAYOS_API_KEY,PAYOS_CHECKSUM_KEY
          script: |
            cd /var/www/flashship
            git pull origin main
            composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-intl

            # Inject APNS_PRIVATE_KEY
            if ! grep -q "APNS_PRIVATE_KEY" .env; then
              echo "APNS_PRIVATE_KEY=\"$APNS_PRIVATE_KEY\"" >> .env
            else
              sed -i "s|^APNS_PRIVATE_KEY=.*|APNS_PRIVATE_KEY=\"$APNS_PRIVATE_KEY\"|" .env
            fi

            # Inject PayOS keys
            for key in PAYOS_CLIENT_ID PAYOS_API_KEY PAYOS_CHECKSUM_KEY; do
              val="${!key}"
              if ! grep -q "^${key}=" .env; then
                echo "${key}=${val}" >> .env
              else
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              fi
            done

            php artisan migrate --force
            php artisan storage:link --quiet || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:cache-components
            php artisan queue:restart
            sudo systemctl reload php8.3-fpm
